# Keep dependencies patched.
#
# The github-actions entry covers the workflow file. The pip entry covers the
# Python package under zt_dsp_sv_py/: its build backend and the test tooling.
# The zt-dsp-py dependency is a git URL into the client repository, which
# Dependabot does not resolve; that pin moves by hand (see ci.yml).
#
# Version-update proposals are off (open-pull-requests-limit: 0): the weekly
# proposals kept arriving as pull requests, and robot pull requests are not
# merged by policy. The pins move only when a maintainer applies the change
# in a signed commit. Alert-driven security fixes stay governed by the
# repository security settings, not by this file.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies, ci]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies]
